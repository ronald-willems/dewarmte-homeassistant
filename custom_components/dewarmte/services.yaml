start_forced_cooling:
  name: Start forced cooling
  description: >-
    Immediately start cooling for a fixed duration, overriding the other cooling
    settings until it ends.
  fields:
    device_id:
      name: Device
      description: The DeWarmte device to cool.
      required: true
      selector:
        device:
          integration: dewarmte
    setpoint:
      name: Setpoint
      description: Target temperature to cool to.
      required: true
      example: 18
      selector:
        number:
          min: 10
          max: 25
          step: 1
          unit_of_measurement: "°C"
    duration_hours:
      name: Duration
      description: How long to keep cooling, in hours.
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 72
          step: 1
          unit_of_measurement: h

stop_forced_cooling:
  name: Stop forced cooling
  description: Stop an active forced-cooling run.
  fields:
    device_id:
      name: Device
      description: The DeWarmte device to stop cooling.
      required: true
      selector:
        device:
          integration: dewarmte
